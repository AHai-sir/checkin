name: GLaDOS Checkin

on:
  workflow_dispatch: # 手动触发
  push:              # 推送时触发
  schedule:
    - cron: '10 16 * * *'  # 每天北京时间 0:10 运行（用于签到）
    - cron: '0 0 1 * *'    # 每月 1 号凌晨 0:00 运行（用于保活）

jobs:
  run:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 【步骤 1】签到控制：排除掉保活定时器即可。即：只要不是每月 1 号的定时器，其余情况（手动、推送、每日定时）全部允许签到。
      - name: Setup Node.js
        if: github.event.schedule != '0 0 1 * *'
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        if: github.event.schedule != '0 0 1 * *'
        run: npm ci || npm install 

      - name: Run Sign-in Script
        if: github.event.schedule != '0 0 1 * *'
        run: node main.js 
        env:
          GLADOS: ${{ secrets.GLADOS }}
          NOTIFY: ${{ secrets.NOTIFY }}

      # 【步骤 2】严格保活控制：断绝一切其他入口。唯独且仅有当触发源是“每月 1 号定时器”时，才允许生成保活提交。
      - name: Keep Workflow Alive
        if: github.event.schedule == '0 0 1 * *'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit --allow-empty -m "chore: monthly repository keep-alive"
          git push
